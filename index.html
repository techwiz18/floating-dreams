<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Dreams</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #cfe4ee; }
  body {
    font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #4b5a66;
  }
  canvas { display: block; }

  /* Score pill, top left */
  #score {
    position: fixed;
    top: 22px;
    left: 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(120, 150, 170, 0.16);
    color: #6b8496;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  #count {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0;
    color: #4f6f86;
    line-height: 1;
    transition: color 0.3s ease;
  }
  #score.pop #count {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    40% { transform: scale(1.35); color: #e8a87c; }
    100% { transform: scale(1); }
  }

  /* Title card fades away on its own */
  #title {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    pointer-events: none;
    user-select: none;
    animation: titleFade 1.6s ease 3.2s forwards;
  }
  #title h1 {
    font-size: clamp(38px, 7vw, 66px);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #ffffff;
    text-shadow: 0 8px 34px rgba(100, 130, 150, 0.35);
  }
  #title p {
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.92);
  }
  @keyframes titleFade {
    to { opacity: 0; }
  }

  /* Hint, bottom center */
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #6d8798;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div id="score"><span id="count">0</span><span>dreams</span></div>
  <div id="title">
    <h1>Floating Dreams</h1>
    <p>a quiet little sky</p>
  </div>
  <div id="hint">Arrow keys drift · collect the glowing crystals</div>

  <!-- Serve over http (e.g. `python3 -m http.server`); ES modules can't load from file://. -->
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { createWorld, step } from './game.js';
    import { createRenderer } from './render.js';

    // Rules live in game.js, drawing in render.js; this file wires them up.
    const world = createWorld();
    const view = createRenderer({
      THREE,
      world,
      dom: {
        parent: document.body,
        score: document.getElementById('score'),
        count: document.getElementById('count')
      }
    });

    // The renderer never reads a global, so the page tells it its size.
    const fit = () => view.resize(innerWidth, innerHeight, Math.min(devicePixelRatio, 2));
    fit();
    addEventListener('resize', fit);

    // ---------------------------------------------------------------------
    // Input
    // ---------------------------------------------------------------------
    const keys = new Set();

    addEventListener('keydown', (event) => {
      if (event.key.startsWith('Arrow')) event.preventDefault();
      keys.add(event.key.toLowerCase());
    });
    addEventListener('keyup', (event) => {
      keys.delete(event.key.toLowerCase());
    });

    function axis(positive, negative) {
      return (positive.some((k) => keys.has(k)) ? 1 : 0) -
             (negative.some((k) => keys.has(k)) ? 1 : 0);
    }

    // ---------------------------------------------------------------------
    // Main loop
    // ---------------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      // Clamp dt so a background tab doesn't fling the orb away.
      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      const events = step(world, {
        x: axis(['arrowright', 'd'], ['arrowleft', 'a']),
        z: axis(['arrowdown', 's'], ['arrowup', 'w'])
      }, dt, time);

      view.update(dt, time, events);
    }

    animate();

    // Handy for tinkering in the browser console.
    window.floatingDreams = { world, get score() { return world.score; } };
  </script>
</body>
</html>
